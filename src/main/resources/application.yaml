spring:
  application:
    name: findex

  datasource:
    url: jdbc:h2:file:./data/testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql



open-api:
  service-key:
  base-url:

scheduler:
  auto-sync:
    cron: "0 * * * * *"
