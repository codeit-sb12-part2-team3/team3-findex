spring:
  application:
    name: findex

  datasource:
    url: jdbc:h2:file:./data/testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

open-api:
  service-key:
  base-url: https://apis.data.go.kr/1160100/service/GetMarketIndexInfoService