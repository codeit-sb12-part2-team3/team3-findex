  service-key: bc8f6e4f29a518481711905f3b1ee6ae18e7a66a54b4ae8bd12531643e1fa59b
  base-url: https://apis.data.go.kr/1160100/service/GetMarketIndexInfoService

scheduler:
  auto-sync:
    cron: "0 * * * * *"
